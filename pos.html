  actualizarTimers(); // el innerHTML de arriba creó spans de timer nuevos
}

/* ---------- contador con semáforo ---------- */
// la cuenta "termina" solo cuando está pagada Y entregada (o legado 'pagada')
const cuentaCompleta = f => f.estado === 'cerrada' &&
  (f.etapa === 'entregada' || f.etapa === 'pagada');
const finCiclo = f => Math.max(
  f.fecha_cierre ? new Date(f.fecha_cierre).getTime() : 0,
  f.fecha_entregada ? new Date(f.fecha_entregada).getTime() : 0);

function minutosCuenta(f) {
  // el contador corre hasta pagada+entregada; pagar solo no lo detiene
  const fin = cuentaCompleta(f) ? finCiclo(f) : Date.now();
  return Math.max(0, Math.floor((fin - new Date(f.fecha_apertura)) / 60000));
}

function actualizarTimers() {
  const [verde, ambar] = state.config.semaforo_min;
  const retencionMs = state.config.retencion_pagada_min * 60000;
  const ahora = Date.now();
  const expirada = f => cuentaCompleta(f) && ahora - finCiclo(f) > retencionMs;

  for (const f of state.facturas) {
    if (expirada(f)) continue;
    const m = minutosCuenta(f);
    document.querySelectorAll(`[data-timer="${f.id}"]`).forEach(el => {
      el.textContent = m + ' min';
      el.className = 'timer ' + (cuentaCompleta(f) ? 't-pagada'
        : m < verde ? 't-ok' : m <= ambar ? 't-medio' : 't-alto');
    });
  }

  if (state.facturas.some(expirada)) {
    state.facturas = state.facturas.filter(f => !expirada(f));
    if (!state.facturas.some(f => f.id === state.activaId)) {
      state.activaId = state.facturas.length ? state.facturas[state.facturas.length-1].id : null;
      if (state.vista === 'cuenta') { setVista('tablero'); return; }
    }
    renderTabs();
    if (state.vista === 'cuenta') renderFactura();
  }
}
setInterval(actualizarTimers, 15000);

async function nuevaFactura(mesa) {
  try {
    const f = await api('/api/facturas', {method:'POST'});
    f.items = [];
    if (typeof mesa === 'string' && mesa) f.mesa = mesa;
    state.facturas.push(f);
    state.activaId = f.id;
    if (f.mesa) programarGuardado(f);
    setVista('cuenta');
    const busca = $('#buscaProd');
    if (busca) busca.focus();
  } catch (e) { toast(e.message, true); }
}

function crearFila(f, it) {
  const fila = document.createElement('div');
  fila.className = 'linea' + (it.entregado ? ' entregada' : '');
  fila.innerHTML = `
    <button type="button" class="btn-chk${it.entregado ? ' on' : ''}" aria-label="Marcar como entregado" title="Entregado al cliente">${ICONOS.entregado}</button>
    <input class="desc" type="text" aria-label="Descripci&oacute;n del &iacute;tem" placeholder="&iacute;tem..." value="">
    <button type="button" class="btn-borrar" aria-label="Quitar &iacute;tem">${ICONOS.borrar}</button>
    <span class="stepper">
      <button type="button" data-d="-1" aria-label="Una menos">&minus;</button>
      <input class="cant" inputmode="decimal" aria-label="Cantidad" value="${it.cantidad ?? 1}">
      <button type="button" data-d="1" aria-label="Una m&aacute;s">+</button>
    </span>
    <input class="precio" inputmode="numeric" aria-label="Precio unitario" placeholder="$ unit." value="${it.precio_unitario ? fmtInputPrecio(String(it.precio_unitario)) : ''}">
    <span class="sub-linea">$0</span>`;

  const cant = fila.querySelector('.cant');
  const desc = fila.querySelector('.desc');
  const precio = fila.querySelector('.precio');
  desc.value = it.descripcion || '';

  const quitar = () => {
    const idx = f.items.indexOf(it);
    if (idx >= 0) f.items.splice(idx, 1);
    fila.remove();
    if (!f.items.length) agregarFila(f);
    recalcular(f); programarGuardado(f);
  };

  const chk = fila.querySelector('.btn-chk');
  chk.addEventListener('click', () => {
    it.entregado = it.entregado ? 0 : 1;
    chk.classList.toggle('on', !!it.entregado);
    fila.classList.toggle('entregada', !!it.entregado);
    programarGuardado(f);
  });
  fila.querySelectorAll('.stepper button').forEach(b => b.addEventListener('click', () => {
    const nueva = (parseFloat(cant.value.replace(',', '.')) || 0) + Number(b.dataset.d);
    if (nueva <= 0) { quitar(); return; }
    it.cantidad = nueva;
    cant.value = String(nueva);
    recalcular(f); programarGuardado(f);
  }));
  cant.addEventListener('input', () => {
    it.cantidad = parseFloat(cant.value.replace(',', '.')) || 0;
    recalcular(f); programarGuardado(f);
  });
  desc.addEventListener('input', () => { it.descripcion = desc.value; programarGuardado(f); });
  armarAutocompletado(fila, desc, precio, it, f);
  precio.addEventListener('input', () => {
    precio.value = fmtInputPrecio(precio.value);
    it.precio_unitario = Number(soloDigitos(precio.value)) || 0;
    recalcular(f); programarGuardado(f);
  });
  precio.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); agregarFila(f); }
  });
  fila.querySelector('.btn-borrar').addEventListener('click', quitar);
  return fila;
}

function agregarFila(f) {
  const it = {cantidad:1, descripcion:'', precio_unitario:0};
  f.items.push(it);
  const fila = crearFila(f, it);
  $('#filas').appendChild(fila);
  fila.querySelector('.desc').focus();
}

function calcularLocal(f) {
  const subtotal = f.items.reduce((s,i) => s + Math.round((i.cantidad||0) * (i.precio_unitario||0)), 0);
  let desc;
  if (f.descuento_tipo === 'porcentaje') {
    desc = Math.round(subtotal * Math.min(Math.max(f.descuento_valor||0, 0), 100) / 100);
  } else {
    desc = Math.min(Math.max(f.descuento_valor||0, 0), subtotal);
  }
  const total = Math.max(subtotal - desc, 0);
  let propina;
  if (f.propina_tipo === 'monto') {
    propina = Math.round(Math.max(f.propina_valor||0, 0));
  } else {
    propina = Math.round(total * Math.min(Math.max(f.propina_valor||0, 0), 100) / 100);
  }
  return {subtotal, descuento:desc, total, propina, pagar: total + propina};
}

function recalcular(f) {
  const t = calcularLocal(f);
  f.subtotal = t.subtotal; f.total = t.total;
  document.querySelectorAll('#filas .linea').forEach((fila, i) => {
    const it = f.items[i];
    if (it) fila.querySelector('.sub-linea').textContent =
      fmt(Math.round((it.cantidad||0) * (it.precio_unitario||0)));
  });
  $('#vSubtotal').textContent = fmt(t.subtotal);
  $('#vDescuento').innerHTML = '&minus;' + fmt(t.descuento);
  $('#vTotal').textContent = fmt(t.total);
  $('#vPropina').textContent = '+' + fmt(t.propina);
  $('#vPagar').textContent = fmt(t.pagar);
  // filas informativas solo cuando aportan algo (si no, A pagar lo dice todo)
  $('#filaSubtotal').hidden = t.descuento <= 0;
  $('#filaDescAplicado').hidden = t.descuento <= 0;
  $('#filaTotal').hidden = t.propina <= 0;
  $('#filaPropinaVal').hidden = t.propina <= 0;
  actualizarPendiente();
}

/* ---------- guardado ---------- */
function programarGuardado(f) {
  if (f.estado !== 'abierta') return; // pagada en retención: nada que autoguardar
  state.pendientes.add(f.id);
  clearTimeout(state.guardados.get(f.id));
  state.guardados.set(f.id, setTimeout(() => guardar(f), 800));
}

async function guardar(f) {
  clearTimeout(state.guardados.get(f.id));
  state.guardados.delete(f.id);
  if (!state.pendientes.has(f.id)) return;
  state.pendientes.delete(f.id);
  try {
    await api(`/api/facturas/${f.id}`, {method:'PUT', body:{
      items: f.items, descuento_tipo: f.descuento_tipo,
      descuento_valor: f.descuento_valor, nota: f.nota || '',
      mesa: f.mesa || '',
      propina_tipo: f.propina_tipo || 'porcentaje',
      propina_valor: f.propina_valor || 0,
      metodo_pago: f.metodo_pago || 'Efectivo'
    }});
  } catch (e) {
    state.pendientes.add(f.id);
    toast('No se pudo guardar: ' + e.message, true);
  }
}

/* ---------- acciones ---------- */
// todo pedido debe decir si es en mesa, para llevar o domicilio
function exigirCanal(f) {
  if (f.estado !== 'abierta' || f.mesa) return true;
  toast('¿Es en mesa, para llevar o domicilio? Elegilo arriba', true);
  const sel = $('#mesaSel');
  if (sel) { sel.classList.add('falta'); sel.focus(); }
  return false;
}

async function cobrar(f) {
  if (!f.items.some(i => (i.descripcion||'').trim() || i.precio_unitario > 0)) {
    toast('La cuenta está vacía', true); return;
  }
  if (!exigirCanal(f)) return;
  try {
    await guardar(f);
    const r = await api(`/api/facturas/${f.id}/cerrar`, {method:'POST'});
    window.open(`/ticket/${f.id}?print=1`, '_blank');
    // la pestaña se queda con badge "Pagado" hasta que expire la retención
    Object.assign(f, r);
    renderTabs(); renderFactura();
    cargarTotalDia();
    toast(`Cuenta ${f.numero} cobrada`);
  } catch (e) { toast(e.message, true); }
}

async function enviarCocina(f) {
  if (!f.items.some(i => (i.descripcion||'').trim() || i.precio_unitario > 0)) {
    toast('La cuenta está vacía', true); return;
  }
  if (!exigirCanal(f)) return;
  try {
    if (f.estado === 'abierta') await guardar(f); // una pagada ya no se edita
    const primera = f.etapa === 'en_progreso';
    if (primera) {
      Object.assign(f, await api(`/api/facturas/${f.id}/etapa`, {method:'POST', body:{etapa:'enviada'}}));
    }
    window.open(`/comanda/${f.id}?print=1${primera ? '' : '&re=1'}`, '_blank');
    renderTabs(); renderFactura();
    if (primera) toast(`Cuenta ${f.numero} enviada a cocina`);
  } catch (e) { toast(e.message, true); }
}

async function cerrarCuenta(f) {
  try {
    await api(`/api/facturas/${f.id}/archivar`, {method:'POST'});
    state.facturas = state.facturas.filter(x => x.id !== f.id);
    if (state.activaId === f.id) {
      state.activaId = state.facturas.length ? state.facturas[state.facturas.length-1].id : null;
    }
    if (state.vista === 'cuenta') setVista('tablero'); else renderTabs();
    toast(`Cuenta ${f.numero} cerrada`);
  } catch (e) { toast(e.message, true); }
}

async function marcarEntregada(f) {
  try {
    Object.assign(f, await api(`/api/facturas/${f.id}/etapa`, {method:'POST', body:{etapa:'entregada'}}));
    renderTabs(); renderFactura();
    toast(`Cuenta ${f.numero} entregada`);
  } catch (e) { toast(e.message, true); }
}

async function imprimirBorrador(f) {
  try {
    await guardar(f);
    window.open(`/ticket/${f.id}?print=1`, '_blank');
  } catch (e) { toast(e.message, true); }
}

function armarAnular(f) {
  const b = $('#btnAnular');
  let armado = false, timer = null;
  b.addEventListener('click', async () => {
    if (!armado) {
      armado = true;
      b.classList.add('confirmando');
      b.innerHTML = ICONOS.anular + ' ¿Seguro? Tocar de nuevo';
      timer = setTimeout(() => {
        armado = false;
        b.classList.remove('confirmando');
        b.innerHTML = ICONOS.anular + ' Anular';
      }, 3500);
      return;
    }
    clearTimeout(timer);
    try {
      await guardar(f);
      await api(`/api/facturas/${f.id}/anular`, {method:'POST'});
      state.facturas = state.facturas.filter(x => x.id !== f.id);
      state.activaId = state.facturas.length ? state.facturas[state.facturas.length-1].id : null;
      setVista('tablero');
      toast(`Cuenta ${f.numero} anulada`);
    } catch (e) { toast(e.message, true); }
  });
}

/* ---------- cierre de caja ---------- */
async function cargarCierre() {
  try {
    const fecha = state.fechaVentas;
    const cierre = await api('/api/cierre?fecha=' + fecha);
    if (fecha !== state.fechaVentas) return; // el usuario ya cambió de día
    state.cierre = cierre;
    // el formulario pertenece a UNA fecha: al cambiar de día se recarga desde
    // el cierre guardado de esa fecha (o base sugerida); dentro del mismo día
    // se respeta lo que el usuario haya digitado
    if (state.cierreFormFecha !== fecha) {
      const c = cierre.cierre;
      if (c) {
        state.cierreForm = {
          base: c.base, efectivo: c.efectivo_contado,
          datafono: c.datafono_contado, transferencias: c.transferencias_contado,
          baseSiguiente: c.base_siguiente ?? c.base
        };
        state.conteoEfectivo = (c.conteo_efectivo && Object.keys(c.conteo_efectivo).length)
          ? {...c.conteo_efectivo} : null;
        state.conteoBaseSiguiente = (c.conteo_base_siguiente && Object.keys(c.conteo_base_siguiente).length)
          ? {...c.conteo_base_siguiente} : null;
      } else {
        // base fija: arranca con la base que quedó del cierre anterior
        const sug = cierre.base_sugerida || 0;
        state.cierreForm = {base: sug, efectivo:0, datafono:0, transferencias:0, baseSiguiente: sug};
        state.conteoEfectivo = null;
        state.conteoBaseSiguiente = null;
      }
      state.cierreFormFecha = fecha;
    }
    if (state.vista === 'ventas') renderVentas();
  } catch {}
}

function calcularCierre() {
  const f = state.cierreForm || {base:0, efectivo:0, datafono:0, transferencias:0};
  const esp = state.cierre?.esperados || {efectivo:0, datafono:0, transferencias:0, salidas:0};
  // cada salida se descuenta de donde salió la plata (efectivo o transferencia)
  const salEf = esp.salidas_efectivo ?? esp.salidas ?? 0;
  const salTr = esp.salidas_transferencias || 0;
  // lo que debería haber en la caja: base + ventas en efectivo − salidas en efectivo
  const espEfCaja = (f.base||0) + esp.efectivo - salEf;
  const espTr = esp.transferencias - salTr;
  const totalFinal = ((f.efectivo||0) - (f.base||0)) + (f.datafono||0) + (f.transferencias||0);
  const esperadoTotal = esp.efectivo + esp.datafono + esp.transferencias - salEf - salTr;
  return {
    f, esp, espEfCaja, espTr, salEf, salTr,
    difEf: (f.efectivo||0) - espEfCaja,
    difDat: (f.datafono||0) - esp.datafono,
    difTr: (f.transferencias||0) - espTr,
    totalFinal, esperadoTotal,
    difTotal: totalFinal - esperadoTotal
  };
}

function pintarDif(el, dif) {
  el.classList.remove('ok', 'falta', 'sobra');
  if (dif === 0) { el.textContent = 'cuadra'; el.classList.add('ok'); }
  else if (dif < 0) { el.textContent = '−' + fmt(-dif); el.classList.add('falta'); }
  else { el.textContent = '+' + fmt(dif); el.classList.add('sobra'); }
}

function actualizarCierreCalculos() {
  const c = calcularCierre();
  $('#cEspEf').textContent = fmt(c.espEfCaja);
  const espTr = $('#cEspTr');
  if (espTr) espTr.textContent = fmt(c.espTr);
  const ger = $('#cAGerencia');
  if (ger) ger.textContent = '→ gerencia ' + fmt(Math.max((c.f.efectivo || 0) - (c.f.baseSiguiente || 0), 0));
  pintarDif($('#cDifEf'), c.difEf);
  pintarDif($('#cDifDat'), c.difDat);
  pintarDif($('#cDifTr'), c.difTr);
  $('#cTotalFinal').textContent = fmt(c.totalFinal);
  $('#cEspTotal').textContent = fmt(c.esperadoTotal);
  pintarDif($('#cDifTotal'), c.difTotal);
}

/* modal genérico de conteo por denominaciones (cierre y apertura) */
function modalConteo({titulo, subtitulo = '', conteo, boton, onAceptar}) {
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  const filas = Object.entries(DENOMINACIONES).map(([grupo, dens]) =>
    `<div class="den-grupo">${grupo}</div>` +
    dens.map(d => `
      <div class="den-fila">
        <span class="den">$${d.toLocaleString('es-CO')}</span>
        <input inputmode="numeric" placeholder="0" data-den="${d}"
               aria-label="Cantidad de ${grupo.toLowerCase()} de ${d}"
               value="${conteo[d] ? conteo[d] : ''}">
        <span class="sub" data-sub="${d}"></span>
      </div>`).join('')
  ).join('');

  overlay.innerHTML = `
    <div class="modal" role="dialog" aria-modal="true" aria-label="${titulo}">
      <div class="modal-head">
        <h3>${titulo}</h3>
        <button type="button" class="cerrar-modal" aria-label="Cerrar">${ICONOS.cerrarX}</button>
      </div>
      ${subtitulo ? `<p class="modal-sub">${subtitulo}</p>` : ''}
      <div class="modal-cuerpo">${filas}</div>
      <div class="modal-total">
        <span class="lbl">Total contado</span>
        <span class="val" id="conteoTotal">$0</span>
      </div>
      <div class="modal-acciones">
        <button type="button" class="btn btn-primario" id="btnUsarTotal">${boton}</button>
        <button type="button" class="btn-limpiar" id="btnLimpiarConteo">Limpiar</button>
      </div>
    </div>`;

  const totalConteo = () =>
    Object.entries(conteo).reduce((s, [d, c]) => s + Number(d) * (c || 0), 0);

  const actualizar = () => {
    overlay.querySelectorAll('input[data-den]').forEach(inp => {
      const d = Number(inp.dataset.den);
      const c = conteo[d] || 0;
      const sub = overlay.querySelector(`[data-sub="${d}"]`);
      sub.textContent = c ? fmt(d * c) : '';
      sub.classList.toggle('con-valor', c > 0);
    });
    overlay.querySelector('#conteoTotal').textContent = fmt(totalConteo());
  };

  const cerrar = () => { overlay.remove(); document.removeEventListener('keydown', alEscape); };
  const alEscape = e => { if (e.key === 'Escape') cerrar(); };
  document.addEventListener('keydown', alEscape);
  overlay.addEventListener('click', e => { if (e.target === overlay) cerrar(); });
  overlay.querySelector('.cerrar-modal').addEventListener('click', cerrar);

  overlay.querySelectorAll('input[data-den]').forEach(inp => {
    inp.addEventListener('input', () => {
      inp.value = soloDigitos(inp.value);
      const c = Number(inp.value) || 0;
      const d = Number(inp.dataset.den);
      if (c > 0) conteo[d] = c; else delete conteo[d];
      actualizar();
    });
  });

  overlay.querySelector('#btnLimpiarConteo').addEventListener('click', () => {
    Object.keys(conteo).forEach(k => delete conteo[k]);
    overlay.querySelectorAll('input[data-den]').forEach(i => { i.value = ''; });
    actualizar();
  });

  overlay.querySelector('#btnUsarTotal').addEventListener('click', async () => {
    try {
      await onAceptar(totalConteo());
      cerrar();
    } catch (e) { toast(e.message, true); }
  });

  document.body.appendChild(overlay);
  actualizar();
  overlay.querySelector('input[data-den]').focus();
}

/* calculadora de vuelto: la cuenta vale $X, el cliente dice cuánto va a pagar
   (la propina es la diferencia y se guarda sola) y con qué billete paga */
function abrirVuelto(f) {
  const t = calcularLocal(f);
  const total = t.total;        // lo que vale la cuenta (sin propina)
  let vaAPagar = t.pagar;       // arranca en el a-pagar actual; lo decide el cliente

  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = `
    <div class="modal" role="dialog" aria-modal="true" aria-label="Calcular vuelto">
      <div class="modal-head">
        <h3>Vuelto</h3>
        <button type="button" class="cerrar-modal" aria-label="Cerrar">${ICONOS.cerrarX}</button>
      </div>
      <div class="modal-cuerpo">
        <div class="vuelto-pagar">
          <span class="lbl">La cuenta vale</span>
          <span class="val">${fmt(total)}</span>
        </div>
        <div class="vuelto-campo">
          <label for="vueltoPagara">Va a pagar (lo que decida el cliente)</label>
          <input id="vueltoPagara" inputmode="numeric" placeholder="0" value="${vaAPagar ? fmtInputPrecio(String(vaAPagar)) : ''}">
        </div>
        <div class="vuelto-pagar vuelto-propina">
          <span class="lbl">Propina</span>
          <span class="val prop-monto" id="vueltoPropina">+${fmt(Math.max(vaAPagar - total, 0))}</span>
        </div>
        <div class="metodos vuelto-pills" id="vueltoRapidos"></div>
        <div class="vuelto-campo">
          <label for="vueltoRecibido">El cliente entrega</label>
          <input id="vueltoRecibido" inputmode="numeric" placeholder="0">
        </div>
        <div class="vuelto-res" id="vueltoRes"><span class="lbl">Devuelta</span><span class="val">&mdash;</span></div>
      </div>
      <div class="modal-acciones">
        <button type="button" class="btn btn-primario" id="btnVueltoListo">Listo</button>
      </div>
    </div>`;

  const inpPagara = overlay.querySelector('#vueltoPagara');
  const inpRecibido = overlay.querySelector('#vueltoRecibido');
  const res = overlay.querySelector('#vueltoRes');
  const propinaCalculada = () => Math.max(vaAPagar - total, 0);

  const calcular = () => {
    overlay.querySelector('#vueltoPropina').textContent = '+' + fmt(propinaCalculada());
    const recibido = Number(soloDigitos(inpRecibido.value)) || 0;
    if (!recibido) {
      res.className = 'vuelto-res';
      res.innerHTML = '<span class="lbl">Devuelta</span><span class="val">&mdash;</span>';
      return;
    }
    const dif = recibido - vaAPagar;
    if (dif >= 0) {
      res.className = 'vuelto-res ok';
      res.innerHTML = `<span class="lbl">Devuelta</span><span class="val">${fmt(dif)}</span>`;
    } else {
      res.className = 'vuelto-res falta';
      res.innerHTML = `<span class="lbl">Faltan</span><span class="val">${fmt(-dif)}</span>`;
    }
  };

  const pintarRapidos = () => {
    const rapidos = [10000, 20000, 50000, 100000].filter(b => b >= vaAPagar);
    const cont = overlay.querySelector('#vueltoRapidos');
    cont.innerHTML =
      `<button type="button" class="metodo" data-monto="${vaAPagar}">Exacto</button>` +
      rapidos.map(b => `<button type="button" class="metodo" data-monto="${b}">${fmt(b)}</button>`).join('');
    cont.querySelectorAll('.metodo').forEach(b => {
      b.addEventListener('click', () => {
        inpRecibido.value = fmtInputPrecio(b.dataset.monto);
        cont.querySelectorAll('.metodo').forEach(x => x.classList.toggle('on', x === b));
        calcular();
      });
    });
  };

  inpPagara.addEventListener('input', () => {
    inpPagara.value = fmtInputPrecio(inpPagara.value);
    vaAPagar = Number(soloDigitos(inpPagara.value)) || 0;
    pintarRapidos();
    calcular();
  });
  inpRecibido.addEventListener('input', () => {
    inpRecibido.value = fmtInputPrecio(inpRecibido.value);
    calcular();
  });

  const cerrar = () => {
    // la propina de la cuenta queda como la diferencia que decidió el cliente
    if (f.estado === 'abierta' && vaAPagar >= total) {
      const nueva = propinaCalculada();
      if (nueva !== t.propina) {
        f.propina_tipo = 'monto';
        f.propina_valor = nueva;
        recalcular(f);
        programarGuardado(f);
        renderFactura();
        toast(nueva > 0
          ? `Propina ${fmt(nueva)} — a pagar ${fmt(vaAPagar)}`
          : `Sin propina — a pagar ${fmt(vaAPagar)}`);
      }
    }
    overlay.remove();
    document.removeEventListener('keydown', alEscape);
  };
  const alEscape = e => { if (e.key === 'Escape') cerrar(); };
  document.addEventListener('keydown', alEscape);
  overlay.addEventListener('click', e => { if (e.target === overlay) cerrar(); });
  overlay.querySelector('.cerrar-modal').addEventListener('click', cerrar);
  overlay.querySelector('#btnVueltoListo').addEventListener('click', cerrar);
  document.body.appendChild(overlay);
  pintarRapidos();
  inpPagara.focus();
  inpPagara.select();
}

// sugiere el cuadre solo cuando: apertura hace >3 h, hubo ventas, la caja está
// tranquila (≤3 cuentas activas) y no hay cuadre reciente ni fue pospuesto
const CUADRE_CADA_MS = 3 * 3600 * 1000;
function chequearCuadre() {
  if (state.cuadreAbierto || state.vista === 'cuenta') return;
  if (document.querySelector('.overlay')) return; // ya hay otro modal abierto
  const editando = document.activeElement && document.activeElement.matches('input, select');
  if (editando) return;
  const a = state.apertura?.apertura;
  if (!a || (state.apertura.fecha || hoyISO()) !== hoyISO()) return;
  const ahora = Date.now();
  if (ahora - new Date(a.guardado_en).getTime() < CUADRE_CADA_MS) return;
  if (!(state.ventasHoy > 0)) return;
  const activas = state.facturas.filter(f => !cuentaCompleta(f)).length;
  if (activas > 3) return;
  const ultimo = state.cuadresHoy.reduce(
    (m, q) => Math.max(m, new Date(q.creado_en).getTime()), 0);
  if (ultimo && ahora - ultimo < CUADRE_CADA_MS) return;
  if (ahora < state.cuadrePospuesto) return;
  abrirCuadre(true);
}

async function abrirCuadre(auto = false) {
  if (state.cuadreAbierto) return;
  state.cuadreAbierto = true;
  let esp, base;
  try {
    const c = await api('/api/cierre?fecha=' + hoyISO());
    esp = c.esperados;
    base = c.base_sugerida || 0;
  } catch (e) { state.cuadreAbierto = false; toast(e.message, true); return; }
  const espEf = base + esp.efectivo - (esp.salidas_efectivo ?? esp.salidas ?? 0);
  const espTr = esp.transferencias - (esp.salidas_transferencias || 0);
  const conteo = {};

  const filasDen = Object.entries(DENOMINACIONES).map(([grupo, dens]) =>
    `<div class="den-grupo">${grupo}</div>` +
    dens.map(d => `
      <div class="den-fila">
        <span class="den">$${d.toLocaleString('es-CO')}</span>
        <input inputmode="numeric" placeholder="0" data-den="${d}"
               aria-label="Cantidad de ${grupo.toLowerCase()} de ${d}">
        <span class="sub" data-sub="${d}"></span>
      </div>`).join('')
  ).join('');

  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = `
    <div class="modal" role="dialog" aria-modal="true" aria-label="Cuadre de turno">
      <div class="modal-head">
        <h3>Cuadre de turno</h3>
        <button type="button" class="cerrar-modal" aria-label="Cerrar">${ICONOS.cerrarX}</button>
      </div>
      <p class="modal-sub">${auto ? 'Momento tranquilo: buena hora para cuadrar la caja. ' : ''}Cont&aacute; el efectivo del caj&oacute;n (incluida la base) y compar&aacute; las transferencias con la app del banco. Queda guardado como auditor&iacute;a del turno.</p>
      <div class="modal-cuerpo">
        ${filasDen}
        <div class="res-fila"><span class="lbl">Efectivo contado</span><span class="val" id="qEf">$0</span></div>
        <div class="res-fila"><span class="lbl">Esperado en caj&oacute;n (base ${fmt(base)} + ventas &minus; salidas)</span><span class="val">${fmt(espEf)}</span></div>
        <div class="res-fila"><span class="lbl">Diferencia efectivo</span><span class="dif" id="qDifEf">&mdash;</span></div>
        <div class="vuelto-campo">
          <label for="qTr">Transferencias de hoy seg&uacute;n la app del banco</label>
          <input id="qTr" inputmode="numeric" placeholder="0">
        </div>
        <div class="res-fila"><span class="lbl">Transferencias esperadas</span><span class="val">${fmt(espTr)}</span></div>
        <div class="res-fila"><span class="lbl">Diferencia transferencias</span><span class="dif" id="qDifTr">&mdash;</span></div>
      </div>
      <div class="modal-acciones">
        <button type="button" class="btn btn-primario" id="qGuardar">Guardar cuadre</button>
        <button type="button" class="btn-limpiar" id="qLuego">Ahora no</button>
      </div>
    </div>`;

  const totalConteo = () =>
    Object.entries(conteo).reduce((s, [d, c]) => s + Number(d) * (c || 0), 0);
  const trContado = () =>
    Number(soloDigitos(overlay.querySelector('#qTr').value)) || 0;

  const pintar = () => {
    overlay.querySelectorAll('input[data-den]').forEach(inp => {
      const d = Number(inp.dataset.den), c = conteo[d] || 0;
      const sub = overlay.querySelector(`[data-sub="${d}"]`);
      sub.textContent = c ? fmt(d * c) : '';
      sub.classList.toggle('con-valor', c > 0);
    });
    overlay.querySelector('#qEf').textContent = fmt(totalConteo());
    pintarDif(overlay.querySelector('#qDifEf'), totalConteo() - espEf);
    pintarDif(overlay.querySelector('#qDifTr'), trContado() - espTr);
  };

  // cerrar sin guardar = posponer, para que la sugerencia no vuelva enseguida
  const posponer = () => {
    state.cuadrePospuesto = Date.now() + 45 * 60000;
    try { localStorage.setItem('posCuadrePospuesto', String(state.cuadrePospuesto)); } catch {}
  };
  const cerrar = () => {
    overlay.remove();
    document.removeEventListener('keydown', alEscape);
    state.cuadreAbierto = false;
  };
  const alEscape = e => { if (e.key === 'Escape') { posponer(); cerrar(); } };
  document.addEventListener('keydown', alEscape);
  overlay.addEventListener('click', e => { if (e.target === overlay) { posponer(); cerrar(); } });
  overlay.querySelector('.cerrar-modal').addEventListener('click', () => { posponer(); cerrar(); });
  overlay.querySelector('#qLuego').addEventListener('click', () => {
    posponer(); cerrar();
    toast('Listo, te lo sugiero de nuevo en un rato');
  });

  overlay.querySelectorAll('input[data-den]').forEach(inp => {
    inp.addEventListener('input', () => {
      inp.value = soloDigitos(inp.value);
      const c = Number(inp.value) || 0;
      const d = Number(inp.dataset.den);
      if (c > 0) conteo[d] = c; else delete conteo[d];
      pintar();
    });
  });
  const qTr = overlay.querySelector('#qTr');
  qTr.addEventListener('input', () => { qTr.value = fmtInputPrecio(qTr.value); pintar(); });

  overlay.querySelector('#qGuardar').addEventListener('click', async () => {
    try {
      const r = await api('/api/cuadres', {method:'POST', body:{
        efectivo_contado: totalConteo(),
        transferencias_contado: trContado(),
        conteo_efectivo: conteo
      }});
      state.cuadresHoy.push(r);
      cerrar();
      const parte = d => d === 0 ? 'cuadra' : (d < 0 ? `falta ${fmt(-d)}` : `sobra ${fmt(d)}`);
      toast(`Cuadre guardado — efectivo: ${parte(r.dif_efectivo)} · transferencias: ${parte(r.dif_transferencias)}`);
      if (state.vista === 'ventas') renderVentas();
    } catch (e) { toast(e.message, true); }
  });

  document.body.appendChild(overlay);
  pintar();
  overlay.querySelector('input[data-den]').focus();
}

async function guardarCierre() {
  const f = state.cierreForm || {};
  try {
    state.cierre = await api('/api/cierre', {method:'POST', body:{
      fecha: state.fechaVentas,
      base: f.base||0, efectivo_contado: f.efectivo||0,
      datafono_contado: f.datafono||0, transferencias_contado: f.transferencias||0,
      base_siguiente: f.baseSiguiente ?? f.base ?? 0,
      conteo_efectivo: state.conteoEfectivo || {},
      conteo_base_siguiente: state.conteoBaseSiguiente || {}
    }});
    toast(`Cierre de caja guardado (${state.fechaVentas})`);
    renderVentas();
    mostrarResumenCierre();
  } catch (e) { toast(e.message, true); }
}

/* modal de resumen al guardar el cierre: qué se contó, qué se recibió y
   cómo se reparte la plata entre caja local, gerencia y la cuenta */
function mostrarResumenCierre() {
  const c = calcularCierre();
  const f = c.f, esp = c.esp;
  const propinas = state.ventasVista?.propinas_dia || 0;
  const propPagadas = (state.movimientos?.movimientos || [])
    .filter(m => m.tipo === 'Propinas').reduce((s, m) => s + (m.monto || 0), 0);
  const propPendiente = propinas - propPagadas;
  const baseQueda = f.baseSiguiente ?? f.base ?? 0;
  const aGerencia = Math.max((f.efectivo || 0) - baseQueda, 0);
  const esHoy = state.fechaVentas === hoyISO();
  const fechaLegible = new Date(state.fechaVentas + 'T12:00:00')
    .toLocaleDateString('es-CO', {weekday:'long', day:'numeric', month:'long'});

  const fila = (lbl, val, cls = '') =>
    `<div class="res-fila${cls ? ' ' + cls : ''}"><span class="lbl">${lbl}</span><span class="val">${val}</span></div>`;
  const difTxt = c.difTotal === 0
    ? '<span class="dif ok">cuadra</span>'
    : c.difTotal < 0
      ? `<span class="dif falta">falta &minus;${fmt(-c.difTotal)}</span>`
      : `<span class="dif sobra">sobra +${fmt(c.difTotal)}</span>`;

  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = `
    <div class="modal" role="dialog" aria-modal="true" aria-label="Resumen del cierre">
      <div class="modal-head">
        <h3>Cierre guardado</h3>
        <button type="button" class="cerrar-modal" aria-label="Cerrar">${ICONOS.cerrarX}</button>
      </div>
      <div class="modal-cuerpo">
        <p class="res-fecha">${esHoy ? 'Hoy, ' : ''}${fechaLegible}</p>

        <div class="den-grupo">Lo que se cont&oacute;</div>
        ${fila('Efectivo en caja (incluye la base)', fmt(f.efectivo || 0))}
        ${fila('Dat&aacute;fono', fmt(f.datafono || 0))}
        ${fila('Transferencias + Nequi', fmt(f.transferencias || 0))}

        <div class="den-grupo">Lo que se recibi&oacute; seg&uacute;n el POS</div>
        ${fila('Efectivo (venta + propina)', fmt(esp.efectivo || 0))}
        ${fila('Dat&aacute;fono (venta + propina)', fmt(esp.datafono || 0))}
        ${fila('Transferencias + Nequi (venta + propina)', fmt(esp.transferencias || 0))}
        ${c.salEf ? fila('Salidas en efectivo (retiros y pagos)', '&minus;' + fmt(c.salEf)) : ''}
        ${c.salTr ? fila('Salidas por transferencia', '&minus;' + fmt(c.salTr)) : ''}

        <div class="den-grupo">Total de dineros del d&iacute;a</div>
        ${fila('Total contado (sin la base)', fmt(c.totalFinal))}
        ${fila('Seg&uacute;n POS (ya descontadas las salidas)', fmt(c.esperadoTotal))}
        <div class="res-fila"><span class="lbl">Diferencia</span>${difTxt}</div>
        ${fila('Propinas recibidas en el d&iacute;a', fmt(propinas))}
        ${propPagadas ? fila('Propinas ya entregadas al equipo', '&minus;' + fmt(propPagadas)) : ''}
        ${fila('Propinas por entregar al equipo', fmt(propPendiente), 'res-propinas')}

        <div class="den-grupo">Reparto de la plata</div>
        ${fila('Queda en Caja local (base para el d&iacute;a siguiente)', fmt(baseQueda))}
        ${fila('Va a Caja gerencia (efectivo)', fmt(aGerencia), 'res-destacada')}
        ${fila('Qued&oacute; en la cuenta (transferencias + Nequi)', fmt(f.transferencias || 0))}
        ${fila('Dat&aacute;fono (llega a la cuenta del banco)', fmt(f.datafono || 0))}
      </div>
      <div class="modal-acciones">
        <button type="button" class="btn btn-primario" id="btnResumenListo">Listo</button>
      </div>
    </div>`;

  const cerrar = () => { overlay.remove(); document.removeEventListener('keydown', alEscape); };
  const alEscape = e => { if (e.key === 'Escape') cerrar(); };
  document.addEventListener('keydown', alEscape);
  overlay.addEventListener('click', e => { if (e.target === overlay) cerrar(); });
  overlay.querySelector('.cerrar-modal').addEventListener('click', cerrar);
  overlay.querySelector('#btnResumenListo').addEventListener('click', cerrar);
  document.body.appendChild(overlay);
  overlay.querySelector('#btnResumenListo').focus();
}

    const hora = new Date(f.fecha_cierre || f.fecha_apertura)
      .toLocaleTimeString('es-CO', {hour:'2-digit', minute:'2-digit'});
    const detalle = f.items.map(i => `${i.cantidad}× ${esc(i.descripcion)}`).join(' &middot; ');

    </div>`;

  $('#btnExport').addEventListener('click', () => {
    const d = $('#expDesde').value, h = $('#expHasta').value;
    window.open(`/api/export?desde=${d}&hasta=${h}`, '_blank');
  });

  // filtro de fecha
  $('#fechaVentasSel').addEventListener('change', e => cambiarFechaVentas(e.target.value));
  const sumarDia = delta => {
    const d = new Date(state.fechaVentas + 'T12:00:00');
    d.setDate(d.getDate() + delta);
    const nueva = d.toLocaleDateString('en-CA');
    if (nueva <= hoy) cambiarFechaVentas(nueva);
  };
  $('#diaAntes').addEventListener('click', () => sumarDia(-1));
  $('#diaDespues').addEventListener('click', () => sumarDia(1));
  const btnHoy = $('#btnVolverHoy');
  if (btnHoy) btnHoy.addEventListener('click', () => cambiarFechaVentas(hoy));

  cont.querySelectorAll('.btn-editar').forEach(b => {
    b.addEventListener('click', () => reabrir(Number(b.dataset.id)));
  });

  // cierre de caja: valores, inputs y guardado
  if (!state.cierreForm) state.cierreForm = {base:0, efectivo:0, datafono:0, transferencias:0};
  cont.querySelectorAll('.cierre-fila input').forEach(inp => {
    const campo = inp.dataset.campo;
    const val = state.cierreForm[campo] || 0;
    inp.value = val ? fmtInputPrecio(String(val)) : '';
    inp.addEventListener('input', () => {
      inp.value = fmtInputPrecio(inp.value);
      state.cierreForm[campo] = Number(soloDigitos(inp.value)) || 0;
      actualizarCierreCalculos();
    });
  });
  $('#btnGuardarCierre').addEventListener('click', guardarCierre);
  const btnQ = $('#btnCuadreAhora');
  if (btnQ) btnQ.addEventListener('click', () => abrirCuadre());
  $('#btnConteo').addEventListener('click', abrirConteo);
  $('#btnConteoBaseSig').addEventListener('click', abrirConteoBaseSiguiente);
  $('#btnApertura').addEventListener('click', abrirModalApertura);

  // retiros y pagos: lista, selector de tipo y registro (registro solo el día en curso)
  const movs = state.movimientos?.movimientos || [];
  $('#movLista').innerHTML = movs.length ? movs.map(m => {
    const hora = new Date(m.creado_en).toLocaleTimeString('es-CO', {hour:'2-digit', minute:'2-digit'});
    return `<div class="mov-fila">
      <span class="hora">${hora}</span>
      <span><span class="chip">${esc(m.tipo)}</span><span class="chip chip-origen">${esc(m.origen || 'Efectivo')}</span></span>
      <span class="concepto">${esc(m.concepto) || '<span style="color:var(--muted)">sin concepto</span>'}</span>
      <span class="monto">&minus;${fmt(m.monto)}</span>
      ${esHoy ? `<button type="button" class="btn-borrar" data-mov="${m.id}" aria-label="Eliminar salida de ${fmt(m.monto)}">${ICONOS.borrar}</button>` : '<span></span>'}
    </div>`;
  }).join('') : `<p class="sin-movs">Sin salidas registradas ${esHoy ? 'hoy' : 'ese día'}.</p>`;
  cont.querySelectorAll('[data-mov]').forEach(b => {
    b.addEventListener('click', () => eliminarMovimiento(Number(b.dataset.mov)));
  });
  if (esHoy) {
    if (!state.movTipo) state.movTipo = 'Retiro';
    const tiposCont = $('#movTipos');
    for (const t of ['Retiro', 'Pago proveedor', 'Gasto', 'Propinas']) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'metodo' + (state.movTipo === t ? ' on' : '');
      b.textContent = t;
      b.setAttribute('aria-pressed', String(state.movTipo === t));
      b.addEventListener('click', () => {
        state.movTipo = t;
        tiposCont.querySelectorAll('.metodo').forEach(x => {
          const on = x.textContent === t;
          x.classList.toggle('on', on);
          x.setAttribute('aria-pressed', String(on));
        });
      });
      tiposCont.appendChild(b);
    }
    if (!state.movOrigen) state.movOrigen = 'Efectivo';
    const origCont = $('#movOrigenes');
    for (const o of ['Efectivo', 'Transferencia']) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'metodo' + (state.movOrigen === o ? ' on' : '');
      b.textContent = o;
      b.setAttribute('aria-pressed', String(state.movOrigen === o));
      b.addEventListener('click', () => {
        state.movOrigen = o;
        origCont.querySelectorAll('.metodo').forEach(x => {
          const on = x.textContent === o;
          x.classList.toggle('on', on);
          x.setAttribute('aria-pressed', String(on));
        });
      });
      origCont.appendChild(b);
    }
    const movMonto = $('#movMonto');
    movMonto.addEventListener('input', () => { movMonto.value = fmtInputPrecio(movMonto.value); });
    movMonto.addEventListener('keydown', e => { if (e.key === 'Enter') registrarMovimiento(); });
    $('#btnRegistrarMov').addEventListener('click', registrarMovimiento);

    // pago de propinas al equipo: prellena la salida y deja elegir el origen
    const btnProp = $('#btnPagarPropinas');
    if (btnProp) btnProp.addEventListener('click', () => {
      state.movTipo = 'Propinas';
      tiposCont.querySelectorAll('.metodo').forEach(x => {
        const on = x.textContent === 'Propinas';
        x.classList.toggle('on', on);
        x.setAttribute('aria-pressed', String(on));
      });
      $('#movConcepto').value = 'Propinas del equipo';
      movMonto.value = fmtInputPrecio(String(propPendiente));
      movMonto.scrollIntoView({behavior:'smooth', block:'center'});
      movMonto.focus();
      toast('Elegí de dónde sale la plata y tocá Registrar');
    });
  }
  const g = state.cierre?.cierre;
  $('#cierreGuardado').textContent = g
    ? `Guardado a las ${new Date(g.guardado_en).toLocaleTimeString('es-CO', {hour:'2-digit', minute:'2-digit'})}`
    : 'Sin guardar todavía';
  actualizarCierreCalculos();
}

async function reabrir(id) {
  try {
    const f = await api(`/api/facturas/${id}/reabrir`, {method:'POST'});
    await cargarFacturas();
    abrirCuenta(f.id);
    cargarTotalDia();
    toast(`Cuenta ${f.numero} reabierta para editar`);
  } catch (e) { toast(e.message, true); }
}

/* ---------- arranque ---------- */
$('#btnVentas').addEventListener('click', () => alternarVentas(state.vista !== 'ventas'));
$('#secMesas').addEventListener('click', () => setSeccion('mesas'));
$('#secPedidos').addEventListener('click', () => setSeccion('pedidos'));

$('#fechaHoy').textContent = new Date().toLocaleDateString('es-CO',
  {weekday:'long', day:'numeric', month:'long'});

async function refrescarSiInactivo() {
  // recargar solo si no se está editando nada
  const editando = document.activeElement && document.activeElement.matches('input, select');
  if (state.pendientes.size === 0 && state.vista !== 'ventas' && !editando) {
    try { await cargarFacturas(); } catch {}
  }
  cargarTotalDia();
}

let recargaTimer = null;
window.addEventListener('focus', () => {
  // tras un respiro, para no pisar el click que trajo el foco
  clearTimeout(recargaTimer);
  recargaTimer = setTimeout(refrescarSiInactivo, 350);
});
// dos cajas en la LAN ven los cambios de etapa de la otra sin cambiar de ventana
setInterval(refrescarSiInactivo, 60000);

(async () => {
  try {
    await Promise.all([cargarFacturas(), cargarMenu(), cargarConfig(), cargarMesas(), cargarApertura(), cargarCuadresHoy()]);
    if (state.vista === 'tablero') renderTablero(); // ya con config y menú cargados
    await cargarTotalDia();
    // primera apertura del día: pedir la base contada por denominaciones
    if (!state.apertura?.apertura) abrirModalApertura();
  } catch (e) {
    toast('No se pudo conectar con el servidor', true);
  }
})();
</script>
